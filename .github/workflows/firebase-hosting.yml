name: Deploy VibraAlto Landing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibraalto-landing-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and deploy Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Verify landing source
        shell: bash
        run: ./scripts/verify-landing.sh

      - name: Stamp release
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/__BUILD_SHA__/$GITHUB_SHA/" public/release.json
          grep -Fq "\"commit\":\"$GITHUB_SHA\"" public/release.json
          index_sha=$(sha256sum public/index.html | cut -d ' ' -f 1)
          favicon_sha=$(sha256sum public/favicon.svg | cut -d ' ' -f 1)
          printf 'EXPECTED_INDEX_SHA=%s\n' "$index_sha" >> "$GITHUB_ENV"
          printf 'EXPECTED_FAVICON_SHA=%s\n' "$favicon_sha" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy hosting target
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN" || { echo "Missing FIREBASE_TOKEN"; exit 1; }
          firebase deploy \
            --only hosting:vibraalto-landing \
            --project vibraaltoai-11f55 \
            --token "$FIREBASE_TOKEN" \
            --non-interactive

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          page_file=$(mktemp)
          favicon_file=$(mktemp)
          trap 'rm -f "$page_file" "$favicon_file"' EXIT

          for target in https://vibraalto.cl https://vibraalto-landing.web.app; do
            verified=false
            for attempt in $(seq 1 12); do
              cache_bust="release=$GITHUB_SHA&attempt=$attempt"
              if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$target/?$cache_bust" -o "$page_file" \
                && curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$target/favicon.svg?$cache_bust" -o "$favicon_file"; then
                deployed_sha=$(sha256sum "$page_file" | cut -d ' ' -f 1)
                deployed_favicon_sha=$(sha256sum "$favicon_file" | cut -d ' ' -f 1)
                release=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$target/release.json?$cache_bust" || true)
                if [[ "$deployed_sha" == "$EXPECTED_INDEX_SHA" ]] \
                  && [[ "$deployed_favicon_sha" == "$EXPECTED_FAVICON_SHA" ]] \
                  && grep -Fq "\"commit\":\"$GITHUB_SHA\"" <<<"$release"; then
                  echo "$target exposes the exact $GITHUB_SHA release"
                  verified=true
                  break
                fi
              fi
              sleep 10
            done

            if [[ "$verified" != true ]]; then
              echo "$target did not expose the exact release in time"
              exit 1
            fi
          done
